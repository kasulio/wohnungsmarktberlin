name: Scraper Canary

on:
  schedule:
    # Daily morning check (06:15 UTC) to detect housing site HTML/API drift early.
    - cron: "15 6 * * *"
  workflow_dispatch:

env:
  GOOGLE_MAPS_API_KEY: ci-placeholder
  NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder
  NUXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ci-placeholder
  LOCAL_SQLITE_PATH: ./server/db/sqlite.db
  BETTER_AUTH_SECRET: ci-placeholder-not-a-secret-0123456789abcdef

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scrape:canary
      - name: Upload failing HTML snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-failures
          path: data/canary-failures/
          if-no-files-found: ignore
          retention-days: 14
